<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายละเอียดยา · PharmaGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=Fragment+Mono&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<script src="assets/js/db.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/ui.js"></script>
</head><body class="font-sans text-slate-800 antialiased min-h-screen flex flex-col">

<header id="nav" class="sticky top-0 z-40 bg-white/90 backdrop-blur"></header>

<main id="app" class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full"></main>

<script>
renderNav('', 'shop');
const p = product(new URLSearchParams(location.search).get('id'));

$('app').innerHTML = !p ? `
  <div class="py-20 text-center bg-white rounded-3xl border-2 border-slate-200 p-8 shadow-sm max-w-md mx-auto">
    <i data-lucide="package-x" class="w-14 h-14 mx-auto text-slate-300 mb-3"></i>
    <h2 class="text-lg font-bold text-slate-800 font-display">ไม่พบรายการยานี้ในระบบ</h2>
    <p class="text-xs text-slate-500 mt-1 mb-6">สินค้านี้อาจถูกยกเลิกหรือลบออกจากคลังแล้ว</p>
    <a href="index.html" class="inline-flex items-center gap-2 h-11 px-6 rounded-full bg-emerald-600 text-white text-xs font-bold font-display hover:bg-emerald-700 transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าร้านค้า
    </a>
  </div>`
: `
<a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-emerald-700 mb-6 transition font-display">
  <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าร้านค้า
</a>

<div class="grid md:grid-cols-2 gap-8 items-start">
  <!-- ภาพถ่ายสินค้า (High-res Product Photo Container with Clay Style) -->
  <div class="bg-white rounded-3xl border-2 border-slate-200/80 p-6 flex items-center justify-center" style="box-shadow: 0 12px 34px rgba(24,50,43,0.06), inset 0 2px 2px rgba(255,255,255,0.9);">
    <div class="w-full aspect-square max-w-sm rounded-2xl overflow-hidden bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center p-4">
      ${productImg(p, 'w-full h-full object-contain hover:scale-105 transition duration-500')}
    </div>
  </div>

  <!-- ข้อมูลสินค้าและปุ่มสั่งซื้อ -->
  <div class="space-y-4">
    <div>
      <div class="flex items-center gap-2 mb-2 font-display">
        <span class="inline-block px-3 py-0.5 rounded-full text-[11px] font-bold ${CLS[p.cls].c}">${CLS[p.cls].t}</span>
        <span class="text-xs text-slate-500 font-semibold">หมวด ${p.cat}</span>
      </div>
      <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight leading-snug font-display">${p.name}</h1>
      <div class="text-xs sm:text-sm text-slate-500 mt-1 font-mono">ชื่อสามัญทางยา: <b class="text-slate-800 font-semibold">${p.generic}</b></div>
    </div>

    <!-- ข้อมูลร้านยาผู้จำหน่าย -->
    <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs font-display">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-emerald-600 shadow-xs">
          <i data-lucide="store" class="w-4 h-4"></i>
        </div>
        <div>
          <div class="font-bold text-slate-900">${shopName(p.sellerId)}</div>
          <div class="text-[10px] text-slate-500">${(userById(p.sellerId)||{}).license || 'ใบอนุญาต ข.ย.1 รับรอง'}</div>
        </div>
      </div>
      <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold text-[10px] flex items-center gap-1 shadow-xs">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600"></i> ตรวจสอบแล้ว
      </span>
    </div>

    <!-- ราคาและส่วนลด -->
    <div class="pt-2">
      <div class="flex items-baseline gap-3">
        <span class="text-3xl sm:text-4xl font-blob text-slate-900">${baht(p.price)}</span>
        ${p.old && p.old > p.price ? `<span class="text-base text-slate-400 line-through font-display">${baht(p.old)}</span>
        <span class="self-center px-2 py-0.5 rounded-full bg-rose-500 text-white text-[11px] font-bold">-${Math.round((1-p.price/p.old)*100)}%</span>` : ''}
        <span class="text-xs text-slate-500 font-display">/ ${p.unit}</span>
      </div>
      <div class="text-xs text-slate-500 mt-1 font-display">
        สถานะสต็อก: <span class="font-bold ${p.stock<20?'text-amber-600':'text-emerald-700'}">${p.stock > 0 ? `มีสินค้าพร้อมส่ง (${p.stock} ${p.unit})` : 'สินค้าหมดชั่วคราว'}</span>
      </div>
    </div>

    ${p.cls !== 'general' ? `
    <div class="p-4 rounded-2xl bg-amber-50/80 border border-amber-200 text-xs text-amber-950 flex gap-3">
      <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-700 shrink-0 mt-0.5"></i>
      <div>
        <b class="font-display">ข้อกำหนดการจำหน่าย:</b>
        <p class="mt-0.5 leading-relaxed">${p.cls === 'rx' ? 'ยาควบคุมพิเศษ ต้องปรึกษาและส่งใบสั่งยาจากแพทย์' : 'ยาอันตราย เภสัชกรจะโทรตรวจสอบความปลอดภัยก่อนส่งมอบ'}</p>
      </div>
    </div>` : ''}

    <!-- ปุ่มเลือกจำนวนและสั่งซื้อ -->
    <div class="pt-2 flex items-center gap-3">
      <div class="flex items-center border-2 border-slate-200 rounded-2xl bg-white p-1 shadow-xs">
        <button onclick="qty(-1)" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600 transition" title="ลดจำนวน">
          <i data-lucide="minus" class="w-4 h-4"></i>
        </button>
        <span id="n" class="w-12 text-center font-blob text-base text-slate-900">1</span>
        <button onclick="qty(1)" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600 transition" title="เพิ่มจำนวน">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>

      <button onclick="buy()" ${p.stock===0?'disabled':''}
        class="flex-1 h-12 px-6 rounded-2xl font-bold font-display text-xs sm:text-sm flex items-center justify-center gap-2 transition shadow-md ${p.stock===0?'bg-slate-100 text-slate-400 cursor-not-allowed':'bg-emerald-600 hover:bg-emerald-700 text-white active:scale-95'}"
        style="${p.stock > 0 ? 'box-shadow: inset 0 2px 2px rgba(255,255,255,0.4), 0 6px 18px rgba(21,95,77,0.25);' : ''}">
        <i data-lucide="shopping-cart" class="w-4 h-4"></i>
        ${p.stock === 0 ? 'สินค้าหมดสต็อก' : 'ใส่ตะกร้าสินค้า'}
      </button>
    </div>
  </div>
</div>

<!-- สรรพคุณและวิธีใช้ -->
<div class="mt-8 grid md:grid-cols-2 gap-5">
  <div class="bg-white rounded-3xl p-6 border-2 border-slate-200/80 shadow-xs">
    <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2 mb-2.5 font-display">
      <span class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center text-xs">✨</span>
      สรรพคุณและข้อบ่งใช้
    </h3>
    <p class="text-xs text-slate-600 leading-relaxed">${p.desc || '-'}</p>
  </div>

  <div class="bg-white rounded-3xl p-6 border-2 border-slate-200/80 shadow-xs">
    <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2 mb-2.5 font-display">
      <span class="w-7 h-7 rounded-lg bg-blue-50 text-blue-700 flex items-center justify-center text-xs">📋</span>
      ขนาดยาและวิธีใช้
    </h3>
    <p class="text-xs text-slate-600 leading-relaxed font-mono">${p.dose || 'ตามฉลากกำกับยา'}</p>
  </div>
</div>`;

let n = 1;
const qty = d => {
  n = Math.max(1, Math.min(n + d, (p ? p.stock : 1) || 1));
  if ($('n')) $('n').textContent = n;
};

function buy() {
  const u = currentUser();
  if (!u) { location.href = 'login.html?next=' + encodeURIComponent(location.href); return; }
  if (u.role !== 'customer') { toast('บัญชีผู้ขายสั่งซื้อไม่ได้ กรุณาใช้บัญชีลูกค้า'); return; }
  if (!addToCart(u.id, p.id, n)) { toast('สินค้าหมดสต็อก'); return; }
  renderNav('', 'shop');
  toast(`เพิ่ม "${p.name}" (${n} ชิ้น) ลงตะกร้าแล้ว ✓`);
}
icons();
</script>
</body></html>
