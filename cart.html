<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตะกร้าสินค้า · PharmaGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=Fragment+Mono&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<script src="assets/js/db.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/ui.js"></script>
</head><body class="font-sans text-slate-800 antialiased min-h-screen flex flex-col">

<header id="nav" class="sticky top-0 z-40 bg-white/90 backdrop-blur"></header>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2.5">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight font-display">ตะกร้าสินค้าของคุณ</h1>
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
    </div>
    <a href="index.html" class="text-xs font-bold font-display text-emerald-700 hover:underline flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i> เลือกซื้อยาเพิ่ม
    </a>
  </div>
  <div id="body" class="grid lg:grid-cols-[1fr_340px] gap-6 items-start"></div>
</main>

<script>
const u = guard(['customer']);
if (u) { renderNav('', ''); render(); }

function render() {
  const gs = cartGroups(u.id);
  if (!gs.length) {
    $('body').innerHTML = `
    <div class="lg:col-span-2 bg-white rounded-3xl border-2 border-slate-200/90 py-16 px-6 text-center max-w-md mx-auto" style="box-shadow: 0 12px 34px rgba(24,50,43,0.06);">
      <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-3xl">
        🛒
      </div>
      <h2 class="text-lg font-bold text-slate-800 font-display">ยังไม่มีสินค้าในตะกร้า</h2>
      <p class="text-xs text-slate-500 mt-1 mb-6">เลือกยาหรือเวชภัณฑ์ที่คุณต้องการ แล้วสั่งซื้อพร้อมจัดส่งด่วนได้ทันที</p>
      <a href="index.html" class="inline-flex items-center gap-2 h-11 px-6 rounded-full bg-emerald-600 text-white text-xs font-bold font-display hover:bg-emerald-700 transition shadow-sm">
        <i data-lucide="store" class="w-4 h-4"></i> เริ่มต้นเลือกซื้อยา
      </a>
    </div>`;
    icons(); return;
  }

  const sub = gs.reduce((s,g)=>s+g.subtotal,0), ship = gs.reduce((s,g)=>s+g.ship,0);
  const total = sub + ship;

  $('body').innerHTML = `
  <div class="space-y-5">
    ${gs.map(g => `
    <div class="bg-white rounded-3xl border-2 border-slate-200/80 overflow-hidden" style="box-shadow: 0 10px 30px rgba(24,50,43,0.05), inset 0 2px 1px rgba(255,255,255,0.9);">
      <!-- หัวร้านค้าและสิทธิ์ส่งฟรี -->
      <div class="px-5 py-3.5 bg-slate-50/80 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs font-display">
        <div class="flex items-center gap-2 font-bold text-slate-900">
          <span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-800 flex items-center justify-center text-xs">🏪</span>
          <span>${g.shop}</span>
        </div>
        <span class="px-3 py-1 rounded-full text-[10px] font-bold ${g.ship?'bg-slate-100 text-slate-600':'bg-emerald-100 text-emerald-800 border border-emerald-200'}">
          ${g.ship ? `ค่าจัดส่งด่วน ${baht(g.ship)} (ซื้อครบ 500 ส่งฟรี)` : 'ส่งฟรีทั่วไทย 🎉'}
        </span>
      </div>

      <!-- รายการสินค้าของร้าน -->
      <div class="p-4 sm:p-5 divide-y divide-slate-100">
        ${g.items.map(({p,q}) => `
        <div class="py-3.5 first:pt-0 last:pb-0 flex gap-4 items-center">
          <a href="product.html?id=${p.id}" class="w-16 h-16 rounded-2xl bg-slate-50 border border-slate-200/90 p-1.5 flex items-center justify-center shrink-0">
            ${productImg(p, 'w-full h-full object-contain')}
          </a>
          <div class="flex-1 min-w-0">
            <a href="product.html?id=${p.id}" class="text-xs sm:text-sm font-bold text-slate-900 hover:text-emerald-700 transition line-clamp-1 font-display">
              ${p.name}
            </a>
            <div class="text-[11px] text-slate-500 mt-0.5 font-display">${baht(p.price)} / ${p.unit}</div>
            <div class="text-xs sm:text-sm font-blob text-slate-900 mt-1">${baht(p.price*q)}</div>
          </div>

          <!-- ตัวปรับจำนวนสินค้า (Tactile Pill Counter) -->
          <div class="flex items-center border-2 border-slate-200 rounded-2xl bg-white p-0.5 shadow-xs">
            <button onclick="chg('${p.id}',-1)" class="w-7 h-7 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600 hover:text-rose-600 transition" title="ลด">
              <i data-lucide="minus" class="w-3.5 h-3.5"></i>
            </button>
            <span class="w-8 text-center text-xs font-blob text-slate-900">${q}</span>
            <button onclick="chg('${p.id}',1)" class="w-7 h-7 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600 hover:text-emerald-700 transition" title="เพิ่ม">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- ลบรายการ -->
          <button onclick="rm('${p.id}')" class="w-8 h-8 rounded-xl hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center transition" title="นำออกจากตะกร้า">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>`).join('')}
      </div>
    </div>`).join('')}
  </div>

  <!-- สรุปยอดและปุ่มสั่งซื้อ -->
  <aside class="bg-white rounded-3xl border-2 border-slate-200/80 p-5 sm:p-6 lg:sticky lg:top-24 space-y-4" style="box-shadow: 0 12px 34px rgba(24,50,43,0.06), inset 0 2px 1px rgba(255,255,255,0.9);">
    <h3 class="font-bold text-sm text-slate-900 border-b border-slate-100 pb-3 font-display">สรุปยอดคำสั่งซื้อ</h3>
    <div class="space-y-2.5 text-xs font-display">
      <div class="flex justify-between text-slate-600"><span>รวมค่าสินค้า</span><span class="font-bold text-slate-900 font-mono">${baht(sub)}</span></div>
      <div class="flex justify-between text-slate-600">
        <span>ค่าจัดส่ง (${gs.length} ร้าน)</span>
        <span class="${ship?'text-slate-800 font-bold font-mono':'text-emerald-600 font-bold'}">${ship?baht(ship):'ฟรี'}</span>
      </div>
      <div class="flex justify-between text-sm font-extrabold text-slate-900 pt-2.5 border-t border-slate-100">
        <span>ยอดชำระสุทธิ</span><span class="text-emerald-700 font-blob text-lg">${baht(total)}</span>
      </div>
    </div>

    <a href="checkout.html" class="w-full h-12 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold font-display text-xs sm:text-sm flex items-center justify-center gap-2 shadow-md transition" style="box-shadow: inset 0 2px 2px rgba(255,255,255,0.4), 0 6px 18px rgba(21,95,77,0.25);">
      ดำเนินการชำระเงิน <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </a>
    <a href="index.html" class="w-full h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold font-display text-xs flex items-center justify-center transition">
      เลือกซื้อยาต่อ
    </a>
  </aside>`;
  icons();
}

const chg = (pid,d) => { setQty(u.id,pid,d); renderNav('',''); render(); };
const rm  = pid => { delete cartOf(u.id)[pid]; save(); renderNav('',''); render(); toast('นำรายการออกจากตะกร้าแล้ว'); };
</script>
</body></html>
